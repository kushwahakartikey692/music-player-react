<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PulsePlay - Local Music Player</title>
  <script type="module" crossorigin src="/assets/index-pPzf1TGq.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-CxKXvUIg.css">
</head>
<body>

  <div id="login-overlay" class="login-overlay">
    <div class="login-card">
      <h2>PulsePlay</h2>
      <p>Login to listen to your music</p>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-user">Username</label>
          <input type="text" id="login-user" required placeholder="user">
        </div>
        <div class="form-group">
          <label for="login-pass">Password</label>
          <input type="password" id="login-pass" required placeholder="user">
        </div>
        <button type="submit" class="btn-login">Login</button>
      </form>
    </div>
  </div>

  <div class="app-layout">

    <aside class="sidebar">
      <div class="brand">
        <span class="brand-title">PulsePlay</span>
      </div>

      <div class="sidebar-section">
        <div class="section-top">
          <span class="section-label">Your Folders</span>
          <label class="btn-add-folder" for="folder-input" title="Open Music Folder">
            + Open Folder
          </label>
          <input type="file" id="folder-input" webkitdirectory directory multiple hidden>
        </div>

        <nav class="folder-nav" id="sidebar-folder-list"></nav>
      </div>

      <div class="sidebar-user">
        <div class="avatar">U</div>
        <div class="user-details">
          <div class="name">User</div>
          <div class="role-badge">Listener</div>
        </div>
        <button class="btn-logout" onclick="handleLogout()" title="Logout">Logout</button>
      </div>
    </aside>

    <div class="main-wrapper">

      <header class="top-header">
        <div class="header-left">
          <button class="btn-back hidden" id="btn-back" onclick="goHome()" title="Back to All Folders">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
          </button>
          <h1 class="view-heading" id="view-heading">All Folders</h1>
        </div>
      </header>

      <main class="content-scroll">

        <section class="view-panel" id="view-home">
          <div class="crates-grid" id="crates-grid"></div>
        </section>

        <section class="view-panel hidden" id="view-category">
          <div class="category-header">
            <div class="category-cover-wrap">
              <img id="detail-cover" src="album-art.png" alt="Cover">
              <img class="category-disc" id="detail-disc" src="cd.png" alt="Disc">
            </div>
            <div class="category-info">
              <span class="folder-tag" id="detail-folder-tag">Local Music</span>
              <h2 class="category-title" id="detail-title">Folder Name</h2>
              <p class="category-meta" id="detail-meta">0 songs</p>
              <button class="btn-play-category" id="btn-play-category" onclick="playCurrentFolder()">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M7.05 3.606l13.49 7.788a.7.7 0 0 1 0 1.212L7.05 20.394A.7.7 0 0 1 6 19.788V4.212a.7.7 0 0 1 1.05-.606z"/>
                </svg>
                Play Folder
              </button>
            </div>
          </div>

          <div class="track-list-card">
            <table class="tracks-table">
              <thead>
                <tr>
                  <th class="col-num">#</th>
                  <th class="col-title">Title</th>
                  <th class="col-folder">Folder</th>
                </tr>
              </thead>
              <tbody id="category-track-list"></tbody>
            </table>
          </div>
        </section>

      </main>

    </div>

    <footer class="player-bar">
      <div class="player-left">
        <div class="thumb-wrap">
          <img id="now-art" src="album-art.png" alt="Now Playing">
        </div>
        <div class="track-details">
          <div class="now-title" id="now-title">audio.mp3</div>
          <div class="now-sub" id="now-sub">Default Track</div>
        </div>
      </div>

      <div class="player-center">
        <div class="controls-row">
          <button class="btn-ctrl" id="btn-prev" title="Previous" onclick="playPreviousSong()">
            <img src="previous.svg" alt="Previous">
          </button>

          <button class="btn-play-main" id="btn-play" title="Play/Pause" onclick="togglePlayPause()">
            <img src="play.svg" id="play-icon" alt="Play">
          </button>

          <button class="btn-ctrl" id="btn-next" title="Next" onclick="playNextSong()">
            <img src="next.svg" alt="Next">
          </button>

          <div class="equalizer-bars" id="equalizer-bars">
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="progress-row">
          <span class="time-text" id="current-time">0:00</span>
          <div class="progress-bar-wrap" id="progress-container" onclick="seekTrack(event)">
            <div class="progress-fill" id="progress-bar"></div>
          </div>
          <span class="time-text" id="duration">0:00</span>
        </div>
      </div>

      <div class="player-right">
        <svg class="vol-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
        <div class="vol-slider-wrap">
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" oninput="changeVolume(this.value)">
        </div>
      </div>
    </footer>

  </div>

  <audio id="my-player" preload="metadata">
    <source src="audio.mp3" type="audio/mpeg">
  </audio>

</body>
</html>
